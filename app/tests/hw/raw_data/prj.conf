CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_HW_STACK_PROTECTION=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_ISM330DHCX_TRIGGER_OWN_THREAD=y
CONFIG_PM=n
CONFIG_LED=n
